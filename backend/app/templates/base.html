<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Event Sync Service{% endblock %}</title>
  {# url_for rather than a hard-coded path: if the mount moves, one line changes. #}
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('meetings_page') }}">Event Sync</a>
    <nav>
      <a href="{{ url_for('meetings_page') }}">Meetings</a>
      <a href="/stats">Sync overview</a>
      <a href="/docs">API</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Reconciled from two upstream sources. Where they disagree, both values are shown.
  </footer>
</body>
</html>
